<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
  <title>电视与签字笔签名图标</title>

  <!-- 天线：Blue Grey 500，实心圆角条 -->
  <g fill="#607D8B">
    <rect x="-3" y="-60" width="6" height="60" rx="3" transform="translate(98,74) rotate(-36.87)" />
    <rect x="-3" y="-60" width="6" height="60" rx="3" transform="translate(120,74) rotate(36.87)" />
    <circle cx="62" cy="26" r="7" />
    <circle cx="156" cy="26" r="7" />
  </g>

  <!-- 电视机身：Indigo 500 -->
  <rect x="32" y="72" width="152" height="112" rx="16" fill="#3F51B5" />
  <!-- 底部深色调带：Indigo 700（Material 层次感） -->
  <path d="M32 160 H184 V168 Q184 184 168 184 H48 Q32 184 32 168 Z" fill="#303F9F" />

  <!-- 屏幕：Light Blue 50 -->
  <rect x="48" y="88" width="88" height="64" rx="8" fill="#E1F5FE" />

  <!-- 旋钮：Amber 500 -->
  <circle cx="164" cy="100" r="8" fill="#FFC107" />
  <circle cx="164" cy="124" r="8" fill="#FFC107" />

  <!-- 扬声器格栅：Indigo 700 圆角矩形 -->
  <rect x="152" y="142" width="24" height="6" rx="3" fill="#303F9F" />
  <rect x="152" y="154" width="24" height="6" rx="3" fill="#303F9F" />

  <!-- 签名笔迹：Grey 800 -->
  <path
    d="M56 206
           C 68 190, 78 214, 92 200
           C 104 188, 110 210, 124 196
           C 134 186, 142 178, 152 170"
    fill="none" stroke="#424242" stroke-width="6" stroke-linecap="round" />

  <!-- 签字笔：Amber 主色 + Grey 800 细节，笔尖落在签名收笔处 -->
  <g transform="translate(152,170) rotate(45)">
    <path d="M0 0 L-9 -20 L9 -20 Z" fill="#FFA000" />
    <path d="M0 0 L-3.5 -8 L3.5 -8 Z" fill="#424242" />
    <rect x="-9" y="-28" width="18" height="8" fill="#424242" />
    <rect x="-10" y="-78" width="20" height="50" rx="3" fill="#FFC107" />
    <rect x="-10" y="-92" width="20" height="14" rx="6" fill="#424242" />
  </g>
</svg>